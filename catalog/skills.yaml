schema_version: 1
skills:
  - name: research-workflow
    directory: research-workflow
    source: personal
    category: orchestration
    default_status: active
    triggers: ["开始科研工作流", "继续论文工作流", "从检索到归档"]
    excludes: ["single-stage request"]
  - name: start-my-day
    directory: start-my-day
    source: personal
    category: discovery
    default_status: active
    triggers: ["今日论文推荐", "开始今天的论文阅读", "start my day", "每日文献"]
    conflicts: [nature-literature-pipeline]
  - name: paper-analyze
    directory: paper-analyze
    source: personal
    category: archive
    default_status: active
    triggers: ["生成 Obsidian 论文笔记", "深度分析并归档"]
    conflicts: [nature-reader]
  - name: paper-search
    directory: paper-search
    source: personal
    category: local-retrieval
    default_status: active
    triggers: ["在我的论文笔记中查找", "搜索本地 Obsidian 文献"]
    conflicts: [nature-academic-search]
  - name: extract-paper-images
    directory: extract-paper-images
    source: personal
    category: figure-extraction
    default_status: active
    triggers: ["从 arXiv 源码提图", "提取论文原图"]
